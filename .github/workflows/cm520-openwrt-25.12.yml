name: CM520 OpenWrt 25.12

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cm520-openwrt-25.12.yml'
      - 'Config_Files/CM520_OpenWrt_25.12.config'
      - 'DIY/cm520-openwrt-pre-feeds.sh'
      - 'DIY/cm520-openwrt-post-config.sh'

permissions:
  contents: write

concurrency:
  group: cm520-openwrt-25-12
  cancel-in-progress: false

env:
  OPENWRT_REPOSITORY: https://github.com/openwrt/openwrt.git
  OPENWRT_BRANCH: openwrt-25.12
  CONFIG_FILE: Config_Files/CM520_OpenWrt_25.12.config

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out build configuration
        uses: actions/checkout@v4

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools rsync unzip file \
            wget zlib1g-dev

      - name: Clone OpenWrt source
        run: |
          git clone --depth 1 --branch "$OPENWRT_BRANCH" \
            "$OPENWRT_REPOSITORY" openwrt

      - name: Set legacy CM520 upgrade compatibility
        working-directory: openwrt
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('target/linux/ipq40xx/image/generic.mk')
          text = path.read_text()
          marker = 'define Device/mobipromo_cm520-79f\n'
          override = (
              marker
              '\t# Older CM520 firmware cannot migrate its swconfig settings.\n'
              '\tDEVICE_COMPAT_VERSION := 1.0\n'
              '\tDEVICE_COMPAT_MESSAGE := Upgrade with Keep settings disabled.\n'
          )
          if marker not in text:
              raise SystemExit('CM520 device definition was not found')
          path.write_text(text.replace(marker, override, 1))
          PY

      - name: Apply feed customizations
        working-directory: openwrt
        run: bash ../DIY/cm520-openwrt-pre-feeds.sh

      - name: Update and install official feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply target configuration
        working-directory: openwrt
        run: |
          cp "../$CONFIG_FILE" .config
          bash ../DIY/cm520-openwrt-post-config.sh
          make defconfig

      - name: Download source archives
        working-directory: openwrt
        run: |
          make download -j"$(nproc)"
          if find dl -type f -size -1024c | grep -q .; then
            echo 'One or more source archives are incomplete.' >&2
            find dl -type f -size -1024c -print >&2
            exit 1
          fi

      - name: Build firmware
        working-directory: openwrt
        run: make -j"$(nproc)"

      - name: Verify flashable image
        working-directory: openwrt
        run: |
          image_dir=bin/targets/ipq40xx/generic
          image=$(find "$image_dir" -maxdepth 1 -type f -name '*cm520-79f-squashfs-sysupgrade.bin' -size +0c -print -quit)
          test -n "$image"
          echo "Verified flashable image: $image"
          tar -xOf "$image" "sysupgrade-mobipromo_cm520-79f/CONTROL" | grep -Fx 'BOARD=mobipromo_cm520-79f'

      - name: Upload resolved configuration
        uses: actions/upload-artifact@v4
        with:
          name: CM520-79F_OpenWrt-25.12_resolved-config
          path: openwrt/.config

      - name: Upload ready-to-flash firmware
        uses: actions/upload-artifact@v4
        with:
          name: CM520-79F_OpenWrt-25.12_firmware
          path: openwrt/bin/targets/ipq40xx/generic
          if-no-files-found: error

      - name: Publish rolling firmware release
        uses: ncipollo/release-action@v1
        with:
          name: CM520-79F OpenWrt 25.12
          tag: cm520-79f-openwrt-25.12
          artifacts: openwrt/bin/targets/ipq40xx/generic/*
          artifactErrorsFailBuild: true
          allowUpdates: true
          removeArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            Official OpenWrt 25.12 firmware for MobiPromo CM520-79F.

            Flash the `*cm520-79f-squashfs-sysupgrade.bin` file only on a
            CM520-79F device. This image requires **Keep settings** to be
            disabled when upgrading from the older swconfig-based firmware.
            Verify the included `sha256sums` file before flashing and keep a
            current configuration backup.